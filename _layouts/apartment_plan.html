<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Angoli di Alfieri</title>
  <link rel="icon" type="image/png" href="{{ '/assets/media/index/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/apartments.css' | relative_url }}">
</head>
<body class="floor-plan-page">
  <main class="floor-plan">
    <a class="back-link" href="{{ '/appartamenti/' | relative_url }}">← Tutti gli appartamenti</a>
    <p class="eyebrow">{{ page.tipologia }}</p>
    <h1>Appartamento {{ page.title }}</h1>
    <a class="floor-plan__image" href="{{ page.floor_plan | relative_url }}" target="_blank" rel="noopener" aria-label="Apri la planimetria {{ page.title }} a dimensione intera"><img src="{{ page.floor_plan | relative_url }}" alt="Planimetria {{ page.title }}" width="1414" height="2000"></a>
    <div class="floor-plan__actions">
      <a class="button" href="{{ page.floor_plan | relative_url }}" target="_blank" rel="noopener">Apri la planimetria ↗</a>
      <a class="button" href="{{ '/' | relative_url }}#contatti">Richiedi informazioni</a>
    </div>
  </main>
</body>
</html>
